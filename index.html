<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>可自訂順序 - 直向車機儀表板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px;
    }

    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #334155;
      position: relative;
      transition: order 0.3s ease; /* 換位時有平滑動畫 */
    }

    /* 右上角切換順序按鈕 */
    .controls {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 4px;
      z-index: 10;
    }
    .btn-move {
      background: #334155;
      color: #38bdf8;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-move:active { background: #0284c7; color: #fff; }

    /* 區塊 1：時間 */
    #card-time { order: 1; flex: 3; }
    .time-header { display: flex; flex-direction: column; }
    .time-main { font-size: 2.6rem; font-weight: 700; color: #38bdf8; font-family: monospace; line-height: 1.1; }
    .date-main { font-size: 0.95rem; color: #94a3b8; margin-top: 2px; }
    .world-clocks { display: flex; justify-content: space-between; border-top: 1px solid #334155; padding-top: 6px; margin-top: 6px; }
    .clock-item { text-align: center; }
    .clock-label { font-size: 0.75rem; color: #64748b; }
    .clock-val { font-size: 0.95rem; font-weight: 600; color: #cbd5e1; font-family: monospace; }

    /* 區塊 2：巴士 */
    #card-bus { order: 2; flex: 4; }
    .bus-header { font-size: 1rem; font-weight: 600; color: #f59e0b; margin-bottom: 6px; }
    .bus-list { display: flex; flex-direction: column; gap: 8px; justify-content: center; height: 100%; }
    .bus-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 8px 12px; border-radius: 8px; }
    .bus-route { font-size: 1.5rem; font-weight: 800; color: #facc15; }
    .bus-dest { font-size: 0.85rem; color: #94a3b8; }
    .bus-eta { font-size: 1.4rem; font-weight: 700; color: #4ade80; }

    /* 區塊 3：天氣 */
    #card-weather { order: 3; flex: 3; }
    .weather-current { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .temp-main { font-size: 2.2rem; font-weight: 700; color: #38bdf8; }
    .forecast-grid { display: flex; justify-content: space-between; border-top: 1px solid #334155; padding-top: 6px; }
    .forecast-item { text-align: center; font-size: 0.75rem; color: #cbd5e1; }
    .forecast-temp { font-weight: 600; margin-top: 2px; color: #f8fafc; }
  </style>
</head>
<body>

  <!-- 時間區塊 -->
  <div class="card" id="card-time">
    <div class="controls">
      <button class="btn-move" onclick="moveCard('card-time', -1)">▲</button>
      <button class="btn-move" onclick="moveCard('card-time', 1)">▼</button>
    </div>
    <div class="time-header">
      <div class="time-main" id="local-time">00:00:00</div>
      <div class="date-main" id="local-date">----年--月--日</div>
    </div>
    <div class="world-clocks">
      <div class="clock-item">
        <div class="clock-label">倫敦 London</div>
        <div class="clock-val" id="time-london">00:00:00</div>
      </div>
      <div class="clock-item">
        <div class="clock-label">法國 Paris</div>
        <div class="clock-val" id="time-paris">00:00:00</div>
      </div>
    </div>
  </div>

  <!-- 巴士區塊 -->
  <div class="card" id="card-bus">
    <div class="controls">
      <button class="btn-move" onclick="moveCard('card-bus', -1)">▲</button>
      <button class="btn-move" onclick="moveCard('card-bus', 1)">▼</button>
    </div>
    <div class="bus-header">🚌 巴士實時到站</div>
    <div class="bus-list">
      <div class="bus-item">
        <div>
          <span class="bus-route">102</span>
          <span class="bus-dest">往 美孚</span>
        </div>
        <div class="bus-eta">3 分鐘</div>
      </div>
      <div class="bus-item">
        <div>
          <span class="bus-route">1A</span>
          <span class="bus-dest">往 中秀茂坪</span>
        </div>
        <div class="bus-eta">11 分鐘</div>
      </div>
    </div>
  </div>

  <!-- 天氣區塊 -->
  <div class="card" id="card-weather">
    <div class="controls">
      <button class="btn-move" onclick="moveCard('card-weather', -1)">▲</button>
      <button class="btn-move" onclick="moveCard('card-weather', 1)">▼</button>
    </div>
    <div class="weather-current">
      <div>
        <span style="font-size:0.8rem; color:#94a3b8;">地區天氣</span>
        <div style="font-size:0.95rem; color:#cbd5e1;">晴朗</div>
      </div>
      <div class="temp-main">25°C</div>
    </div>
    <div class="forecast-grid" id="forecast-container"></div>
  </div>

  <script>
    // 1. 動態調換卡片順序邏輯
    const cards = ['card-time', 'card-bus', 'card-weather'];

    function loadOrder() {
      const savedOrder = JSON.parse(localStorage.getItem('dash_card_order'));
      if (savedOrder) {
        savedOrder.forEach((id, index) => {
          const el = document.getElementById(id);
          if (el) el.style.order = index + 1;
        });
      }
    }

    function moveCard(cardId, direction) {
      // 取得現有卡片按 order 排序後的陣列
      const currentOrderList = cards.map(id => ({
        id,
        order: parseInt(document.getElementById(id).style.order || (cards.indexOf(id) + 1))
      })).sort((a, b) => a.order - b.order);

      const index = currentOrderList.findIndex(item => item.id === cardId);
      const targetIndex = index + direction;

      // 超出邊界不處理
      if (targetIndex < 0 || targetIndex >= currentOrderList.length) return;

      // 交換兩者的 order 值
      const tempOrder = currentOrderList[index].order;
      currentOrderList[index].order = currentOrderList[targetIndex].order;
      currentOrderList[targetIndex].order = tempOrder;

      // 套用新順序並儲存
      const newSavedOrder = [];
      currentOrderList.sort((a, b) => a.order - b.order).forEach((item, idx) => {
        const el = document.getElementById(item.id);
        el.style.order = idx + 1;
        newSavedOrder.push(item.id);
      });

      localStorage.setItem('dash_card_order', JSON.stringify(newSavedOrder));
    }

    // 初始化載入排版偏好
    loadOrder();

    // 2. 時鐘運作
    function updateClocks() {
      const now = new Date();
      document.getElementById('local-time').textContent = now.toLocaleTimeString('zh-HK', { hour12: false });
      document.getElementById('local-date').textContent = now.toLocaleDateString('zh-HK', { month: '2-digit', day: '2-digit', weekday: 'short' });

      document.getElementById('time-london').textContent = new Intl.DateTimeFormat('zh-HK', {
        timeZone: 'Europe/London', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      }).format(now);

      document.getElementById('time-paris').textContent = new Intl.DateTimeFormat('zh-HK', {
        timeZone: 'Europe/Paris', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      }).format(now);
    }
    setInterval(updateClocks, 1000);
    updateClocks();

    // 3. 預設 5 天天氣
    const mockDays = ['周二', '周三', '周四', '周五', '周六'];
    document.getElementById('forecast-container').innerHTML = mockDays.map(d => `
      <div class="forecast-item">
        <div>${d}</div>
        <div class="forecast-temp">26°</div>
      </div>
    `).join('');
  </script>
</body>
</html>
