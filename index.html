<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>大埔巴士實時車機儀表板 - 相容修復版</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: row;
      gap: 0.8vw;
      padding: 0.8vh 0.8vw;
    }

    .card {
      flex: 1;
      background: #1e293b;
      border-radius: 12px;
      padding: 1vh 1vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #334155;
      position: relative;
      transition: order 0.3s ease;
      min-width: 0;
      height: 100%;
    }

    .controls {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      gap: 4px;
      z-index: 10;
    }
    .btn-move {
      background: #334155;
      color: #38bdf8;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 區塊 1：香港時間 */
    #card-time { order: 1; }
    .time-header { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      text-align: center; 
      flex: 1;
    }
    .time-main { 
      font-size: clamp(2.5rem, 6.5vw, 5rem); 
      font-weight: 900; 
      color: #38bdf8; 
      font-family: monospace; 
      line-height: 1; 
      letter-spacing: -1px; 
    }
    .tz-label { font-size: clamp(1.1rem, 2.8vh, 1.6rem); color: #f59e0b; font-weight: 900; margin-top: 8px; }
    .date-main { font-size: clamp(1.3rem, 3.2vh, 2rem); color: #cbd5e1; font-weight: 800; margin-top: 6px; }
    
    /* 世界時鐘 */
    .world-clocks { display: flex; justify-content: space-around; border-top: 2px solid #334155; padding-top: 8px; }
    .clock-item { text-align: center; flex: 1; }
    .clock-label { font-size: clamp(1.1rem, 2.8vh, 1.6rem); color: #38bdf8; font-weight: 900; }
    .clock-date { font-size: clamp(0.95rem, 2.2vh, 1.3rem); color: #cbd5e1; font-weight: 700; margin-top: 2px; }
    .clock-val { font-size: clamp(1.4rem, 3.5vh, 2rem); font-weight: 900; color: #38bdf8; font-family: monospace; margin-top: 2px; }

    /* 區塊 2：巴士實時到站 */
    #card-bus { order: 2; }
    .bus-header { font-size: clamp(1.2rem, 3vh, 1.7rem); font-weight: 900; color: #f59e0b; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .bus-list { display: flex; flex-direction: column; gap: 0.8vh; justify-content: space-between; flex: 1; }
    .bus-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 1vh 14px; border-radius: 8px; flex: 1; }
    .bus-info { display: flex; flex-direction: column; }
    .bus-route-group { display: flex; align-items: center; gap: 10px; }
    .bus-route { font-size: clamp(2.2rem, 5vh, 3rem); font-weight: 900; color: #facc15; line-height: 1; }
    .bus-stop { font-size: clamp(1rem, 2.2vh, 1.3rem); color: #38bdf8; background: #1e293b; padding: 3px 8px; border-radius: 4px; font-weight: 800; }
    .bus-dest { font-size: clamp(1.1rem, 2.5vh, 1.4rem); color: #e2e8f0; font-weight: 700; margin-top: 4px; }
    .bus-eta-group { text-align: right; }
    .bus-eta-main { font-size: clamp(1.6rem, 4vh, 2.4rem); font-weight: 900; color: #4ade80; }
    .bus-eta-sub { font-size: clamp(1.05rem, 2.3vh, 1.35rem); font-weight: 800; color: #94a3b8; margin-top: 2px; }

    /* 區塊 3：天氣 */
    #card-weather { order: 3; }
    .weather-current { 
      display: flex; 
      flex-direction: column;
      align-items: center; 
      justify-content: center;
      text-align: center;
      flex: 1.5;
    }
    .weather-title { font-size: clamp(1.2rem, 3vh, 1.7rem); color: #38bdf8; font-weight: 900; }
    
    .weather-main-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin: 8px 0;
    }
    .weather-text { font-size: clamp(1.4rem, 3.5vh, 2rem); color: #f8fafc; font-weight: 900; display: flex; align-items: center; gap: 8px; }
    .weather-icon { font-size: clamp(2.5rem, 6.5vh, 4rem); line-height: 1; }
    
    .temp-box { display: flex; flex-direction: column; align-items: center; }
    .temp-main { font-size: clamp(3rem, 7.5vh, 5rem); font-weight: 900; color: #38bdf8; line-height: 0.9; }
    .temp-range { font-size: clamp(1.1rem, 2.6vh, 1.5rem); font-weight: 800; color: #cbd5e1; margin-top: 4px; }

    .weather-extra-info { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
    .rain-prob { font-size: clamp(0.95rem, 2.3vh, 1.25rem); font-weight: 800; color: #38bdf8; background: #0f172a; padding: 4px 10px; border-radius: 6px; border: 1px solid #334155; }
    .weather-warning { font-size: clamp(0.95rem, 2.3vh, 1.25rem); font-weight: 800; color: #ef4444; background: #451a1a; padding: 4px 10px; border-radius: 6px; border: 1px solid #7f1d1d; }
    .weather-warning.none { color: #94a3b8; background: #0f172a; border-color: #334155; }

    /* 未來 5 小時降雨 */
    .hourly-rain-box { background: #0f172a; border-radius: 8px; padding: 8px; margin: 8px 0; border: 1px solid #334155; }
    .hourly-title { font-size: clamp(0.9rem, 2.1vh, 1.15rem); color: #38bdf8; font-weight: 800; text-align: center; margin-bottom: 4px; }
    .hourly-grid { display: flex; justify-content: space-around; }
    .hourly-item { text-align: center; flex: 1; }
    .hourly-time { font-size: clamp(0.85rem, 2vh, 1.05rem); color: #94a3b8; font-weight: 700; }
    .hourly-val { font-size: clamp(1rem, 2.4vh, 1.3rem); color: #38bdf8; font-weight: 900; }

    /* 5 天預報 */
    .forecast-grid { display: flex; justify-content: space-around; border-top: 2px solid #334155; padding-top: 8px; }
    .forecast-item { text-align: center; flex: 1; }
    .forecast-date { font-size: clamp(0.8rem, 1.9vh, 1rem); color: #94a3b8; font-weight: 700; }
    .forecast-day { font-size: clamp(0.95rem, 2.2vh, 1.2rem); color: #cbd5e1; font-weight: 800; }
    .forecast-icon { font-size: clamp(1.2rem, 2.8vh, 1.7rem); }
    .forecast-temp { font-weight: 800; font-size: clamp(0.9rem, 2.1vh, 1.15rem); color: #f8fafc; white-space: nowrap; }

    @media (max-width: 768px) and (orientation: portrait) {
      body { flex-direction: column; padding: 8px; gap: 8px; }
      .btn-move { width: 32px; height: 32px; font-size: 1.1rem; }
      .time-main { font-size: 3.2rem; }
      .bus-route { font-size: 2.2rem; }
      .bus-eta-main { font-size: 1.8rem; }
      .temp-main { font-size: 3.5rem; }
    }
  </style>
</head>
<body>

  <!-- 時間區塊 -->
  <div class="card" id="card-time">
    <div class="controls">
      <button class="btn-move" onclick="moveCard('card-time', -1)">◀</button>
      <button class="btn-move" onclick="moveCard('card-time', 1)">▶</button>
    </div>
    <div class="time-header">
      <div class="time-main" id="local-time">--:--:-- AM</div>
      <div class="tz-label">香港時間 (Hong Kong)</div>
      <div class="date-main" id="local-date">--/--/---- (周-)</div>
    </div>
    <div class="world-clocks">
      <div class="clock-item">
        <div class="clock-label">倫敦 London</div>
        <div class="clock-date" id="date-london">--/--/---- 周-</div>
        <div class="clock-val" id="time-london">--:--:-- AM</div>
      </div>
      <div class="clock-item">
        <div class="clock-label">法國 Paris</div>
        <div class="clock-date" id="date-paris">--/--/---- 周-</div>
        <div class="clock-val" id="time-paris">--:--:-- AM</div>
      </div>
    </div>
  </div>

  <!-- 巴士實時區塊 -->
  <div class="card" id="card-bus">
    <div class="controls">
      <button class="btn-move" onclick="moveCard('card-bus', -1)">◀</button>
      <button class="btn-move" onclick="moveCard('card-bus', 1)">▶</button>
    </div>
    <div class="bus-header">
      <span>🚌 大埔巴士實時到站</span>
    </div>
    <div class="bus-list">
      <div class="bus-item">
        <div class="bus-info">
          <div class="bus-route-group"><span class="bus-route">73</span><span class="bus-stop">大元邨</span></div>
          <span class="bus-dest">往 華明</span>
        </div>
        <div class="bus-eta-group">
          <div class="bus-eta-main" id="eta-73-1">載入中...</div>
          <div class="bus-eta-sub" id="eta-73-2">--</div>
        </div>
      </div>

      <div class="bus-item">
        <div class="bus-info">
          <div class="bus-route-group"><span class="bus-route">72K</span><span class="bus-stop">大元邨</span></div>
          <span class="bus-dest">往 太和</span>
        </div>
        <div class="bus-eta-group">
          <div class="bus-eta-main" id="eta-72k-1">載入中...</div>
          <div class="bus-eta-sub" id="eta-72k-2">--</div>
        </div>
      </div>

      <div class="bus-item">
        <div class="bus-info">
          <div class="bus-route-group"><span class="bus-route">72</span><span class="bus-stop">文娛中心</span></div>
          <span class="bus-dest">往 長沙灣</span>
        </div>
        <div class="bus-eta-group">
          <div class="bus-eta-main" id="eta-72-1">載入中...</div>
          <div class="bus-eta-sub" id="eta-72-2">--</div>
        </div>
      </div>

      <div class="bus-item">
        <div class="bus-info">
          <div class="bus-route-group"><span class="bus-route">272E</span><span class="bus-stop">怡閣苑</span></div>
          <span class="bus-dest">往 太和</span>
        </div>
        <div class="bus-eta-group">
          <div class="bus-eta-main" id="eta-272e-1">載入中...</div>
          <div class="bus-eta-sub" id="eta-272e-2">--</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 天氣區塊 -->
  <div class="card" id="card-weather">
    <div class="controls">
      <button class="btn-move" onclick="moveCard('card-weather', -1)">◀</button>
      <button class="btn-move" onclick="moveCard('card-weather', 1)">▶</button>
    </div>
    <div class="weather-current">
      <div class="weather-title">大埔天氣</div>
      <div class="weather-main-group">
        <div class="weather-text">
          <span class="weather-icon" id="weather-icon">🌤️</span>
          <span id="weather-desc">多雲</span>
        </div>
        <div class="temp-box">
          <div class="temp-main" id="current-temp">--°C</div>
          <div class="temp-range" id="today-temp-range">--° - --°</div>
        </div>
      </div>
      
      <div class="weather-extra-info">
        <div class="rain-prob" id="rain-probability">☔ 今日降雨機率: --</div>
        <div class="weather-warning none" id="weather-warning">✓ 無警告生效</div>
      </div>
    </div>

    <div class="hourly-rain-box">
      <div class="hourly-title">🌧️ 未來 5 小時逐小時降雨預報</div>
      <div class="hourly-grid" id="hourly-rain-container"></div>
    </div>

    <div class="forecast-grid" id="forecast-container"></div>
  </div>

  <script>
    // 排版儲存修復 (防止 localStorage 不支援時報錯)
    var cards = ['card-time', 'card-bus', 'card-weather'];
    function loadOrder() {
      try {
        var savedOrder = JSON.parse(localStorage.getItem('dash_card_order'));
        if (savedOrder && savedOrder.length) {
          for (var i = 0; i < savedOrder.length; i++) {
            var el = document.getElementById(savedOrder[i]);
            if (el) el.style.order = i + 1;
          }
        }
      } catch (e) {}
    }

    function moveCard(cardId, direction) {
      try {
        var currentOrderList = [];
        for (var i = 0; i < cards.length; i++) {
          var id = cards[i];
          var el = document.getElementById(id);
          var orderVal = el.style.order ? parseInt(el.style.order) : (i + 1);
          currentOrderList.push({ id: id, order: orderVal });
        }
        currentOrderList.sort(function(a, b) { return a.order - b.order; });

        var index = -1;
        for (var j = 0; j < currentOrderList.length; j++) {
          if (currentOrderList[j].id === cardId) { index = j; break; }
        }
        var targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= currentOrderList.length) return;

        var tempOrder = currentOrderList[index].order;
        currentOrderList[index].order = currentOrderList[targetIndex].order;
        currentOrderList[targetIndex].order = tempOrder;

        currentOrderList.sort(function(a, b) { return a.order - b.order; });
        var newSavedOrder = [];
        for (var k = 0; k < currentOrderList.length; k++) {
          var item = currentOrderList[k];
          document.getElementById(item.id).style.order = k + 1;
          newSavedOrder.push(item.id);
        }
        localStorage.setItem('dash_card_order', JSON.stringify(newSavedOrder));
      } catch (e) {}
    }
    loadOrder();

    // 基礎時間格式化（相容舊車機）
    function padZero(num) {
      return num < 10 ? '0' + num : '' + num;
    }

    function updateClocks() {
      try {
        var now = new Date();
        var days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

        // 本地香港時間
        var hours = now.getHours();
        var minutes = now.getMinutes();
        var seconds = now.getSeconds();
        var ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12;
        var timeStr = padZero(hours) + ':' + padZero(minutes) + ':' + padZero(seconds) + ' ' + ampm;
        
        var dateStr = padZero(now.getDate()) + '/' + padZero(now.getMonth() + 1) + '/' + now.getFullYear();
        var dayStr = days[now.getDay()];

        document.getElementById('local-time').textContent = timeStr;
        document.getElementById('local-date').textContent = dateStr + ' (' + dayStr + ')';

        // 倫敦時間 (UTC+0 / UTC+1 簡化計算)
        var utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        var londonOffset = 1; // 假設夏令時間 UTC+1
        var londonTime = new Date(utc + (3600000 * londonOffset));
        var lHours = londonTime.getHours();
        var lAmpm = lHours >= 12 ? 'PM' : 'AM';
        lHours = lHours % 12 || 12;
        
        document.getElementById('date-london').textContent = padZero(londonTime.getDate()) + '/' + padZero(londonTime.getMonth() + 1) + ' ' + days[londonTime.getDay()];
        document.getElementById('time-london').textContent = padZero(lHours) + ':' + padZero(londonTime.getMinutes()) + ':' + padZero(londonTime.getSeconds()) + ' ' + lAmpm;

        // 法國時間 (UTC+2 夏令)
        var parisOffset = 2;
        var parisTime = new Date(utc + (3600000 * parisOffset));
        var pHours = parisTime.getHours();
        var pAmpm = pHours >= 12 ? 'PM' : 'AM';
        pHours = pHours % 12 || 12;

        document.getElementById('date-paris').textContent = padZero(parisTime.getDate()) + '/' + padZero(parisTime.getMonth() + 1) + ' ' + days[parisTime.getDay()];
        document.getElementById('time-paris').textContent = padZero(pHours) + ':' + padZero(parisTime.getMinutes()) + ':' + padZero(parisTime.getSeconds()) + ' ' + pAmpm;

      } catch (err) {
        console.error('Clock error:', err);
      }
    }
    setInterval(updateClocks, 1000);
    updateClocks();

    // 通用 HTTP 請求 (兼容 XMLHttpRequest)
    function httpGet(url, callback) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            try {
              callback(null, JSON.parse(xhr.responseText));
            } catch (e) {
              callback(e, null);
            }
          } else {
            callback('Status: ' + xhr.status, null);
          }
        }
      };
      xhr.send();
    }

    var BUS_TARGETS = [
      { idPrefix: 'eta-73', route: '73', exactStopId: 'B5A51DAF80BFC3FC', dest: '華明' },
      { idPrefix: 'eta-72k', route: '72K', exactStopId: 'B5A51DAF80BFC3FC', dest: '太和' },
      { idPrefix: 'eta-72', route: '72', exactStopId: 'C7EA6E2A3423DE05', dest: '長沙灣' },
      { idPrefix: 'eta-272e', route: '272E', exactStopId: '2F7D742C5D6CDE92', dest: '太和' }
    ];

    function fetchKmbETA() {
      for (var i = 0; i < BUS_TARGETS.length; i++) {
        (function(target) {
          var url = 'https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/' + target.exactStopId;
          httpGet(url, function(err, data) {
            if (err || !data || !data.data) {
              document.getElementById(target.idPrefix + '-1').textContent = '無連線';
              return;
            }
            var busList = [];
            for (var j = 0; j < data.data.length; j++) {
              var b = data.data[j];
              if (b.route === target.route && b.eta && b.dest_tc.indexOf(target.dest) !== -1) {
                busList.push(b);
              }
            }
            busList.sort(function(a, b) {
              return new Date(a.eta) - new Date(b.eta);
            });

            if (busList.length > 0) {
              updateETADisplay(target.idPrefix + '-1', busList[0].eta, false);
              updateETADisplay(target.idPrefix + '-2', busList[1] ? busList[1].eta : null, true);
            } else {
              document.getElementById(target.idPrefix + '-1').textContent = '暫無班次';
              document.getElementById(target.idPrefix + '-2').textContent = '--';
            }
          });
        })(BUS_TARGETS[i]);
      }
    }

    function updateETADisplay(elementId, etaISO, isSub) {
      var el = document.getElementById(elementId);
      if (!etaISO) {
        el.textContent = '--';
        return;
      }
      var diffMins = Math.round((new Date(etaISO) - new Date()) / 60000);
      if (diffMins <= 0) {
        el.textContent = '即將到站';
        if (!isSub) el.style.color = '#facc15';
      } else {
        el.textContent = isSub ? ('次班 ' + diffMins + '分') : (diffMins + ' 分鐘');
        if (!isSub) el.style.color = '#4ade80';
      }
    }

    setInterval(fetchKmbETA, 15000);
    fetchKmbETA();

    function getWeatherIcon(desc) {
      if (!desc) return '🌤️';
      if (desc.indexOf('雨') !== -1) return '🌧️';
      if (desc.indexOf('晴') !== -1) return '☀️';
      if (desc.indexOf('雲') !== -1 || desc.indexOf('陰') !== -1) return '⛅';
      return '🌤️';
    }

    function fetchHourlyRainForecast() {
      var url = 'https://api.open-meteo.com/v1/forecast?latitude=22.45&longitude=114.16&hourly=precipitation_probability&timezone=Asia%2FHong_Kong';
      httpGet(url, function(err, data) {
        if (!err && data && data.hourly && data.hourly.time) {
          var now = new Date();
          var html = '';
          for (var i = 1; i <= 5; i++) {
            var nextHour = new Date(now.getTime() + i * 3600000);
            var hourStr = padZero(nextHour.getHours());
            
            var targetTimeStr = nextHour.getFullYear() + '-' + padZero(nextHour.getMonth() + 1) + '-' + padZero(nextHour.getDate()) + 'T' + hourStr + ':00';
            var idx = data.hourly.time.indexOf(targetTimeStr);
            var prob = (idx !== -1 && data.hourly.precipitation_probability[idx] !== undefined) ? data.hourly.precipitation_probability[idx] : 0;

            html += '<div class="hourly-item">' +
                      '<div class="hourly-time">' + hourStr + ':00</div>' +
                      '<div class="hourly-val">' + prob + '%</div>' +
                    '</div>';
          }
          document.getElementById('hourly-rain-container').innerHTML = html;
        }
      });
    }

    function renderDefaultForecast() {
      var days = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
      var today = new Date();
      var html = '';
      for (var i = 1; i <= 5; i++) {
        var nextDate = new Date(today);
        nextDate.setDate(today.getDate() + i);
        var m = padZero(nextDate.getMonth() + 1);
        var d = padZero(nextDate.getDate());
        var dayIdx = nextDate.getDay() === 0 ? 6 : nextDate.getDay() - 1;
        
        html += '<div class="forecast-item">' +
                  '<div class="forecast-date">' + m + '/' + d + '</div>' +
                  '<div class="forecast-day">' + days[dayIdx] + '</div>' +
                  '<div class="forecast-icon">🌤️</div>' +
                  '<div class="forecast-temp">22°-27°</div>' +
                '</div>';
      }
      document.getElementById('forecast-container').innerHTML = html;
      fetchHourlyRainForecast();
    }

    function fetchHKOData() {
      // 天氣警告
      httpGet('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc', function(err, warnData) {
        var warnEl = document.getElementById('weather-warning');
        if (!err && warnData && Object.keys(warnData).length > 0) {
          var warnings = [];
          for (var k in warnData) { warnings.push(warnData[k].name); }
          warnEl.textContent = '⚠️ ' + warnings.join('、') + '生效';
          warnEl.className = 'weather-warning';
        } else {
          warnEl.textContent = '✓ 無警告生效';
          warnEl.className = 'weather-warning none';
        }
      });

      // 現時氣溫
      httpGet('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc', function(err, rhrData) {
        if (!err && rhrData && rhrData.temperature && rhrData.temperature.data) {
          for (var i = 0; i < rhrData.temperature.data.length; i++) {
            if (rhrData.temperature.data[i].place === '大埔') {
              document.getElementById('current-temp').textContent = rhrData.temperature.data[i].value + '°C';
              break;
            }
          }
        }
      });

      // 9天預報
      httpGet('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc', function(err, fndData) {
        if (!err && fndData && fndData.weatherForecast && fndData.weatherForecast.length > 0) {
          var todayForecast = fndData.weatherForecast[0];
          var minT = todayForecast.forecastMintemp ? todayForecast.forecastMintemp.value : '--';
          var maxT = todayForecast.forecastMaxtemp ? todayForecast.forecastMaxtemp.value : '--';
          document.getElementById('today-temp-range').textContent = minT + '° - ' + maxT + '°';
          
          var psr = todayForecast.PSR || todayForecast.forecastPSR || '中';
          document.getElementById('rain-probability').textContent = '☔ 今日降雨機率: ' + psr;

          if (todayForecast.forecastForecast) {
            document.getElementById('weather-desc').textContent = todayForecast.forecastForecast.substring(0, 4);
            document.getElementById('weather-icon').textContent = getWeatherIcon(todayForecast.forecastForecast);
          }

          var fiveDays = fndData.weatherForecast.slice(1, 6);
          var html = '';
          for (var j = 0; j < fiveDays.length; j++) {
            var f = fiveDays[j];
            var m = f.forecastDate.substring(4, 6);
            var d = f.forecastDate.substring(6, 8);
            var weekStr = f.week ? f.week.replace('星期', '周') : '周-';
            html += '<div class="forecast-item">' +
                      '<div class="forecast-date">' + m + '/' + d + '</div>' +
                      '<div class="forecast-day">' + weekStr + '</div>' +
                      '<div class="forecast-icon">' + getWeatherIcon(f.forecastForecast) + '</div>' +
                      '<div class="forecast-temp">' + f.forecastMintemp.value + '°- ' + f.forecastMaxtemp.value + '°</div>' +
                    '</div>';
          }
          document.getElementById('forecast-container').innerHTML = html;
        } else {
          renderDefaultForecast();
        }
      });
      fetchHourlyRainForecast();
    }

    renderDefaultForecast();
    fetchHKOData();
    setInterval(fetchHKOData, 300000);
  </script>
</body>
</html>
