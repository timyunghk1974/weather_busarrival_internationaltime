<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>大埔巴士實時車機儀表板 - 自適應全螢幕版</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      gap: 1.2vh;
      padding: 1.2vh 1.2vw;
    }

    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 1.2vh 1.5vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #334155;
      position: relative;
      transition: order 0.3s ease;
      min-height: 0;
    }

    /* 右上角切換順序按鈕 */
    .controls {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      gap: 4px;
      z-index: 10;
    }
    .btn-move {
      background: #334155;
      color: #38bdf8;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-move:active { background: #0284c7; color: #fff; }

    /* 區塊 1：時間 */
    #card-time { order: 1; flex: 3.5; }
    .time-header { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      text-align: center; 
      flex: 1;
    }
    .time-main { 
      font-size: clamp(2.2rem, 7vh, 4.2rem); 
      font-weight: 900; 
      color: #38bdf8; 
      font-family: monospace; 
      line-height: 1; 
      letter-spacing: -1px; 
    }
    .tz-label { font-size: clamp(0.75rem, 2vh, 1.0rem); color: #f59e0b; font-weight: 800; margin-top: 2px; }
    .date-main { font-size: clamp(0.85rem, 2.2vh, 1.2rem); color: #cbd5e1; font-weight: 700; }
    
    /* 世界時鐘 */
    .world-clocks { display: flex; justify-content: space-around; border-top: 1px solid #334155; padding-top: 4px; }
    .clock-item { text-align: center; flex: 1; }
    .clock-label { font-size: clamp(0.8rem, 2vh, 1.15rem); color: #38bdf8; font-weight: 900; }
    .clock-date { font-size: clamp(0.7rem, 1.6vh, 0.95rem); color: #cbd5e1; font-weight: 700; }
    .clock-val { font-size: clamp(0.95rem, 2.5vh, 1.4rem); font-weight: 900; color: #38bdf8; font-family: monospace; }

    /* 區塊 2：巴士實時到站 */
    #card-bus { order: 2; flex: 4.5; }
    .bus-header { font-size: clamp(0.9rem, 2.2vh, 1.2rem); font-weight: 800; color: #f59e0b; display: flex; justify-content: space-between; align-items: center; }
    .bus-list { display: flex; flex-direction: column; gap: 0.8vh; justify-content: space-evenly; height: 100%; }
    .bus-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 0.6vh 10px; border-radius: 8px; }
    .bus-info { display: flex; flex-direction: column; }
    .bus-route-group { display: flex; align-items: center; gap: 6px; }
    .bus-route { font-size: clamp(1.2rem, 3vh, 1.6rem); font-weight: 900; color: #facc15; line-height: 1; }
    .bus-stop { font-size: clamp(0.7rem, 1.6vh, 0.85rem); color: #38bdf8; background: #1e293b; padding: 1px 5px; border-radius: 4px; font-weight: 700; }
    .bus-dest { font-size: clamp(0.75rem, 1.8vh, 0.95rem); color: #cbd5e1; font-weight: 600; }
    .bus-eta-group { text-align: right; }
    .bus-eta-main { font-size: clamp(1.0rem, 2.6vh, 1.4rem); font-weight: 900; color: #4ade80; }
    .bus-eta-sub { font-size: clamp(0.7rem, 1.6vh, 0.85rem); font-weight: 700; color: #94a3b8; }

    /* 區塊 3：天氣 (Google/全球氣象數據源) */
    #card-weather { order: 3; flex: 5.2; }
    .weather-current { 
      display: flex; 
      flex-direction: column;
      align-items: center; 
      justify-content: center;
      text-align: center;
      flex: 1;
    }
    .weather-title { font-size: clamp(0.95rem, 2.4vh, 1.3rem); color: #38bdf8; font-weight: 800; }
    
    .weather-main-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .weather-text { font-size: clamp(0.9rem, 2.2vh, 1.2rem); color: #f8fafc; font-weight: 800; display: flex; align-items: center; gap: 4px; }
    .weather-icon { font-size: clamp(1.4rem, 3.5vh, 2.0rem); line-height: 1; }
    
    .temp-box { display: flex; flex-direction: column; align-items: center; }
    .temp-main { font-size: clamp(1.8rem, 4.5vh, 2.8rem); font-weight: 900; color: #38bdf8; line-height: 1; }
    .temp-range { font-size: clamp(0.75rem, 1.8vh, 0.95rem); font-weight: 800; color: #cbd5e1; }

    .weather-extra-info { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
    .rain-prob { font-size: clamp(0.7rem, 1.6vh, 0.85rem); font-weight: 800; color: #38bdf8; background: #0f172a; padding: 1px 6px; border-radius: 4px; border: 1px solid #334155; }

    /* 未來 5 小時降雨 */
    .hourly-rain-box { background: #0f172a; border-radius: 6px; padding: 4px; margin: 3px 0; border: 1px solid #334155; }
    .hourly-title { font-size: clamp(0.65rem, 1.5vh, 0.8rem); color: #38bdf8; font-weight: 800; text-align: center; }
    .hourly-grid { display: flex; justify-content: space-around; }
    .hourly-item { text-align: center; flex: 1; }
    .hourly-time { font-size: clamp(0.6rem, 1.4vh, 0.75rem); color: #94a3b8; font-weight: 700; }
    .hourly-val { font-size: clamp(0.7rem, 1.6vh, 0.85rem); color: #38bdf8; font-weight: 900; }

    /* 5 天預報 */
    .forecast-grid { display: flex; justify-content: space-around; border-top: 1px solid #334155; padding-top: 2px; }
    .forecast-item { text-align: center; flex: 1; }
    .forecast-date { font-size: clamp(0.65rem, 1.5vh, 0.8rem); color: #94a3b8; font-weight: 700; }
    .forecast-day { font-size: clamp(0.7rem, 1.6vh, 0.85rem); color: #cbd5e1; font-weight: 800; }
    .forecast-icon { font-size: clamp(0.9rem, 2vh, 1.2rem); }
    .forecast-temp { font-weight: 800; font-size: clamp(0.7rem, 1.6vh, 0.85rem); color: #f8fafc; white-space: nowrap; }

    @media (max-width: 600px) and (orientation: portrait) {
      body { padding: 8px; gap: 8px; }
      .btn-move { width: 32px; height: 32px; font-size: 1.1rem; }
      .time-main { font-size: 2.8rem; }
      .bus-route { font-size: 1.4rem; }
      .temp-main { font-size: 2.2rem; }
    }
  </style>
</head>
<body>

  <!-- 時間區塊 -->
  <div class="card" id="card-time">
    <div class="controls">
      <button class="btn-move" onclick="moveCard('card-time', -1)">▲</button>
      <button class="btn-move" onclick="moveCard('card-time', 1)">▼</button>
    </div>
    <div class="time-header">
      <div class="time-main" id="local-time">--:--:-- AM</div>
      <div class="tz-label">香港時間 (Hong Kong)</div>
      <div class="date-main" id="local-date">--/--/---- (周-)</div>
    </div>
    <div class="world-clocks">
      <div class="clock-item">
        <div class="clock-label">倫敦 London</div>
        <div class="clock-date" id="date-london">--/--/---- 周-</div>
        <div class="clock-val" id="time-london">--:--:-- AM</div>
      </div>
      <div class="clock-item">
        <div class="clock-label">法國 Paris</div>
        <div class="clock-date" id="date-paris">--/--/---- 周-</div>
        <div class="clock-val" id="time-paris">--:--:-- AM</div>
      </div>
    </div>
  </div>

  <!-- 巴士實時區塊 -->
  <div class="card" id="card-bus">
    <div class="controls">
      <button class="btn-move" onclick="moveCard('card-bus', -1)">▲</button>
      <button class="btn-move" onclick="moveCard('card-bus', 1)">▼</button>
    </div>
    <div class="bus-header">
      <span>🚌 大埔巴士實時到站</span>
    </div>
    <div class="bus-list">
      <div class="bus-item">
        <div class="bus-info">
          <div class="bus-route-group">
            <span class="bus-route">73</span>
            <span class="bus-stop">大元邨</span>
          </div>
          <span class="bus-dest">往 華明</span>
        </div>
        <div class="bus-eta-group">
          <div class="bus-eta-main" id="eta-73-1">載入中...</div>
          <div class="bus-eta-sub" id="eta-73-2">--</div>
        </div>
      </div>

      <div class="bus-item">
        <div class="bus-info">
          <div class="bus-route-group">
            <span class="bus-route">72K</span>
            <span class="bus-stop">大元邨</span>
          </div>
          <span class="bus-dest">往 太和</span>
        </div>
        <div class="bus-eta-group">
          <div class="bus-eta-main" id="eta-72k-1">載入中...</div>
          <div class="bus-eta-sub" id="eta-72k-2">--</div>
        </div>
      </div>

      <div class="bus-item">
        <div class="bus-info">
          <div class="bus-route-group">
            <span class="bus-route">72</span>
            <span class="bus-stop">文娛中心</span>
          </div>
          <span class="bus-dest">往 長沙灣</span>
        </div>
        <div class="bus-eta-group">
          <div class="bus-eta-main" id="eta-72-1">載入中...</div>
          <div class="bus-eta-sub" id="eta-72-2">--</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 天氣區塊 -->
  <div class="card" id="card-weather">
    <div class="controls">
      <button class="btn-move" onclick="moveCard('card-weather', -1)">▲</button>
      <button class="btn-move" onclick="moveCard('card-weather', 1)">▼</button>
    </div>
    <div class="weather-current">
      <div class="weather-title">大埔天氣 (Google/全球測站數據)</div>
      <div class="weather-main-group">
        <div class="weather-text">
          <span class="weather-icon" id="weather-icon">🌤️</span>
          <span id="weather-desc">載入中</span>
        </div>
        <div class="temp-box">
          <div class="temp-main" id="current-temp">--°C</div>
          <div class="temp-range" id="today-temp-range">--° - --°</div>
        </div>
      </div>
      
      <div class="weather-extra-info">
        <div class="rain-prob" id="rain-probability">☔ 今日最高降雨機率: --%</div>
      </div>
    </div>

    <!-- 未來 5 小時每小時降雨機率 -->
    <div class="hourly-rain-box">
      <div class="hourly-title">🌧️ 未來 5 小時逐小時降雨預報</div>
      <div class="hourly-grid" id="hourly-rain-container"></div>
    </div>

    <div class="forecast-grid" id="forecast-container"></div>
  </div>

  <script>
    const cards = ['card-time', 'card-bus', 'card-weather'];

    function loadOrder() {
      const savedOrder = JSON.parse(localStorage.getItem('dash_card_order'));
      if (savedOrder) {
        savedOrder.forEach((id, index) => {
          const el = document.getElementById(id);
          if (el) el.style.order = index + 1;
        });
      }
    }

    function moveCard(cardId, direction) {
      const currentOrderList = cards.map(id => ({
        id,
        order: parseInt(document.getElementById(id).style.order || (cards.indexOf(id) + 1))
      })).sort((a, b) => a.order - b.order);

      const index = currentOrderList.findIndex(item => item.id === cardId);
      const targetIndex = index + direction;

      if (targetIndex < 0 || targetIndex >= currentOrderList.length) return;

      const tempOrder = currentOrderList[index].order;
      currentOrderList[index].order = currentOrderList[targetIndex].order;
      currentOrderList[targetIndex].order = tempOrder;

      const newSavedOrder = [];
      currentOrderList.sort((a, b) => a.order - b.order).forEach((item, idx) => {
        const el = document.getElementById(item.id);
        el.style.order = idx + 1;
        newSavedOrder.push(item.id);
      });

      localStorage.setItem('dash_card_order', JSON.stringify(newSavedOrder));
    }

    loadOrder();

    function formatDate(date) {
      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const year = date.getFullYear();
      return `${day}/${month}/${year}`;
    }

    function formatWorldDate(date, timeZone) {
      const options = { timeZone, day: '2-digit', month: '2-digit', year: 'numeric', weekday: 'short' };
      const parts = new Intl.DateTimeFormat('zh-HK', options).formatToParts(date);
      let day = '', month = '', year = '', weekday = '';
      for (let p of parts) {
        if (p.type === 'day') day = p.value;
        if (p.type === 'month') month = p.value;
        if (p.type === 'year') year = p.value;
        if (p.type === 'weekday') weekday = p.value;
      }
      return `${day}/${month}/${year} (${weekday})`;
    }

    function format12HourTime(date, timeZone = null) {
      const options = {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
      };
      if (timeZone) options.timeZone = timeZone;
      return new Intl.DateTimeFormat('en-US', options).format(date);
    }

    function updateClocks() {
      const now = new Date();
      
      document.getElementById('local-time').textContent = format12HourTime(now);
      const weekDayStr = now.toLocaleDateString('zh-HK', { weekday: 'short' });
      document.getElementById('local-date').textContent = `${formatDate(now)} (${weekDayStr})`;

      document.getElementById('date-london').textContent = formatWorldDate(now, 'Europe/London');
      document.getElementById('time-london').textContent = format12HourTime(now, 'Europe/London');

      document.getElementById('date-paris').textContent = formatWorldDate(now, 'Europe/Paris');
      document.getElementById('time-paris').textContent = format12HourTime(now, 'Europe/Paris');
    }
    setInterval(updateClocks, 1000);
    updateClocks();

    async function fetchWithFallback(url) {
      try {
        const res = await fetch(url);
        if (res.ok) return await res.json();
      } catch (e) {
        console.warn('Direct fetch failed, trying CORS proxy...');
      }
      const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
      const proxyRes = await fetch(proxyUrl);
      return await proxyRes.json();
    }

    const BUS_TARGETS = [
      { idPrefix: 'eta-73',  route: '73',  exactStopId: 'B5A51DAF80BFC3FC', searchName: '大元邨', dest: '華明' },
      { idPrefix: 'eta-72k', route: '72K', exactStopId: 'B5A51DAF80BFC3FC', searchName: '大元邨', dest: '太和' },
      { idPrefix: 'eta-72',  route: '72',  exactStopId: 'C7EA6E2A3423DE05', searchName: '大埔文娛中心', dest: '長沙灣' }
    ];

    async function fetchKmbETA() {
      for (const target of BUS_TARGETS) {
        try {
          let busList = [];
          const url = `https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${target.exactStopId}`;
          const data = await fetchWithFallback(url);

          if (data && data.data) {
            busList = data.data.filter(b => b.route === target.route && b.eta && b.dest_tc.includes(target.dest));
          }

          if (busList.length === 0 && window.allStops) {
            const targetStops = window.allStops
              .filter(s => s.name_tc && s.name_tc.includes(target.searchName))
              .map(s => s.stop);

            for (let stopId of targetStops) {
              const etaData = await fetchWithFallback(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`);
              if (etaData && etaData.data) {
                const buses = etaData.data.filter(b => b.route === target.route && b.eta && b.dest_tc.includes(target.dest));
                busList = busList.concat(buses);
              }
            }
          }

          busList.sort((a, b) => new Date(a.eta) - new Date(b.eta));

          if (busList.length > 0) {
            updateETADisplay(`${target.idPrefix}-1`, busList[0].eta);
            updateETADisplay(`${target.idPrefix}-2`, busList[1] ? busList[1].eta : null, true);
          } else {
            document.getElementById(`${target.idPrefix}-1`).textContent = '暫無班次';
            document.getElementById(`${target.idPrefix}-2`).textContent = '--';
          }
        } catch (error) {
          document.getElementById(`${target.idPrefix}-1`).textContent = '連線失敗';
        }
      }
    }

    function updateETADisplay(elementId, etaISO, isSub = false) {
      const el = document.getElementById(elementId);
      if (!etaISO) {
        el.textContent = '--';
        return;
      }
      const diffMins = Math.round((new Date(etaISO) - new Date()) / 60000);

      if (diffMins <= 0) {
        el.textContent = '即將到站';
        if (!isSub) el.style.color = '#facc15';
      } else {
        el.textContent = isSub ? `次班 ${diffMins}分` : `${diffMins} 分鐘`;
        if (!isSub) el.style.color = '#4ade80';
      }
    }

    setInterval(fetchKmbETA, 15000);
    fetchKmbETA();

    /* 天氣代碼轉換圖示與文字 (WMO Code) */
    function parseWMOCode(code) {
      if (code === 0) return { desc: '晴朗', icon: '☀️' };
      if ([1, 2, 3].includes(code)) return { desc: '多雲', icon: '⛅' };
      if ([45, 48].includes(code)) return { desc: '有霧', icon: '🌫️' };
      if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return { desc: '有雨', icon: '🌧️' };
      if ([95, 96, 99].includes(code)) return { desc: '雷暴', icon: '⛈️' };
      return { desc: '多雲', icon: '🌤️' };
    }

    /* 調用 Open-Meteo API (大埔座標: 22.45, 114.16) */
    async function fetchGoogleStyleWeatherData() {
      try {
        const lat = 22.45, lon = 114.16;
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=precipitation_probability&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weathercode&timezone=Asia%2FHong_Kong`;
        
        const res = await fetch(url);
        const data = await res.json();

        if (data && data.current_weather) {
          // 當前天氣
          const currTemp = Math.round(data.current_weather.temperature);
          const weatherInfo = parseWMOCode(data.current_weather.weathercode);
          
          document.getElementById('current-temp').textContent = `${currTemp}°C`;
          document.getElementById('weather-desc').textContent = weatherInfo.desc;
          document.getElementById('weather-icon').textContent = weatherInfo.icon;

          // 今日高低溫 & 降雨機率
          const maxT = Math.round(data.daily.temperature_2m_max[0]);
          const minT = Math.round(data.daily.temperature_2m_min[0]);
          const maxRainProb = data.daily.precipitation_probability_max[0] || 0;

          document.getElementById('today-temp-range').textContent = `${minT}° - ${maxT}°`;
          document.getElementById('rain-probability').textContent = `☔ 今日最高降雨機率: ${maxRainProb}%`;

          // 未來 5 小時每小時降雨機率
          const currentHourIndex = new Date().getHours();
          let hourlyHtml = '';
          for (let i = 1; i <= 5; i++) {
            const hourIdx = (currentHourIndex + i) % 24;
            const hourProb = data.hourly.precipitation_probability[currentHourIndex + i] || 0;
            const hourLabel = String(hourIdx).padStart(2, '0') + ':00';
            hourlyHtml += `
              <div class="hourly-item">
                <div class="hourly-time">${hourLabel}</div>
                <div class="hourly-val">${hourProb}%</div>
              </div>
            `;
          }
          document.getElementById('hourly-rain-container').innerHTML = hourlyHtml;

          // 未來 5 天預報
          const daysOfWeek = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
          let forecastHtml = '';
          for (let i = 1; i <= 5; i++) {
            const dateObj = new Date(data.daily.time[i]);
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            const dayStr = daysOfWeek[dateObj.getDay()];
            const dayCode = data.daily.weathercode[i];
            const dayIcon = parseWMOCode(dayCode).icon;
            const dayMin = Math.round(data.daily.temperature_2m_min[i]);
            const dayMax = Math.round(data.daily.temperature_2m_max[i]);

            forecastHtml += `
              <div class="forecast-item">
                <div class="forecast-date">${m}/${d}</div>
                <div class="forecast-day">${dayStr}</div>
                <div class="forecast-icon">${dayIcon}</div>
                <div class="forecast-temp">${dayMin}°-${dayMax}°</div>
              </div>
            `;
          }
          document.getElementById('forecast-container').innerHTML = forecastHtml;
        }
      } catch (err) {
        console.error('Weather Data Fetch Error:', err);
      }
    }

    fetchGoogleStyleWeatherData();
    setInterval(fetchGoogleStyleWeatherData, 300000);
  </script>
</body>
</html>
