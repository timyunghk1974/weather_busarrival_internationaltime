<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大埔巴士實時車機儀表板 - 完整版</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px;
    }

    .card {
      background: #1e293b;
      border-radius: 14px;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #334155;
      position: relative;
      transition: order 0.3s ease;
    }

    /* 右上角切換順序按鈕 */
    .controls {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 6px;
      z-index: 10;
    }
    .btn-move {
      background: #334155;
      color: #38bdf8;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-move:active { background: #0284c7; color: #fff; }

    /* 區塊 1：時間 */
    #card-time { order: 1; flex: 3.5; }
    .time-header { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      text-align: center; 
      flex: 1;
      padding: 0;
    }
    .time-main { 
      font-size: 4.0rem; 
      font-weight: 900; 
      color: #38bdf8; 
      font-family: monospace; 
      line-height: 0.9; 
      letter-spacing: -2px; 
    }
    .tz-label { font-size: 1.0rem; color: #f59e0b; font-weight: 800; margin-top: 4px; letter-spacing: 0.5px; }
    .date-main { font-size: 1.2rem; color: #cbd5e1; margin-top: 1px; font-weight: 700; }
    
    .world-clocks { display: flex; justify-content: space-around; border-top: 2px solid #334155; padding-top: 6px; margin-top: 2px; }
    .clock-item { text-align: center; }
    .clock-label { font-size: 0.95rem; color: #94a3b8; font-weight: 700; }
    .clock-date { font-size: 0.85rem; color: #f8fafc; font-weight: 600; margin-top: 1px; }
    .clock-val { font-size: 1.2rem; font-weight: 900; color: #38bdf8; font-family: monospace; margin-top: 1px; }

    /* 區塊 2：巴士實時到站 */
    #card-bus { order: 2; flex: 4.5; }
    .bus-header { font-size: 1.2rem; font-weight: 800; color: #f59e0b; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; padding-right: 85px; }
    .bus-list { display: flex; flex-direction: column; gap: 6px; justify-content: center; height: 100%; }
    .bus-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 6px 12px; border-radius: 10px; }
    .bus-info { display: flex; flex-direction: column; }
    .bus-route-group { display: flex; align-items: center; gap: 8px; }
    .bus-route { font-size: 1.6rem; font-weight: 900; color: #facc15; line-height: 1; }
    .bus-stop { font-size: 0.85rem; color: #38bdf8; background: #1e293b; padding: 2px 6px; border-radius: 6px; font-weight: 700; }
    .bus-dest { font-size: 0.95rem; color: #cbd5e1; font-weight: 600; margin-top: 2px; }
    .bus-eta-group { text-align: right; }
    .bus-eta-main { font-size: 1.4rem; font-weight: 900; color: #4ade80; }
    .bus-eta-sub { font-size: 0.85rem; font-weight: 700; color: #94a3b8; }

    /* 區塊 3：天氣 */
    #card-weather { order: 3; flex: 5.2; }
    .weather-current { 
      display: flex; 
      flex-direction: column;
      align-items: center; 
      justify-content: center;
      text-align: center;
      flex: 1;
      padding: 2px 0;
    }
    .weather-title { font-size: 1.4rem; color: #38bdf8; font-weight: 800; margin-bottom: 2px; }
    
    .weather-main-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin: 2px 0;
    }
    .weather-text { font-size: 1.2rem; color: #f8fafc; font-weight: 800; display: flex; align-items: center; gap: 6px; }
    .weather-icon { font-size: 2.0rem; line-height: 1; }
    
    .temp-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .temp-main { font-size: 2.8rem; font-weight: 900; color: #38bdf8; line-height: 1; }
    .temp-range { font-size: 0.95rem; font-weight: 800; color: #cbd5e1; margin-top: 2px; }

    .weather-extra-info {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 2px;
    }
    
    .rain-prob {
      font-size: 0.9rem;
      font-weight: 800;
      color: #38bdf8;
      background: #0f172a;
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid #334155;
    }

    .weather-warning {
      font-size: 0.9rem;
      font-weight: 800;
      color: #ef4444;
      background: #451a1a;
      padding: 2px 8px;
      border-radius: 6px;
      display: inline-block;
      border: 1px solid #7f1d1d;
    }
    .weather-warning.none {
      color: #94a3b8;
      background: #0f172a;
      border-color: #334155;
    }

    /* 未來 5 小時每小時降雨機率 */
    .hourly-rain-box {
      background: #0f172a;
      border-radius: 8px;
      padding: 6px;
      margin: 4px 0;
      border: 1px solid #334155;
    }
    .hourly-title {
      font-size: 0.8rem;
      color: #38bdf8;
      font-weight: 800;
      margin-bottom: 4px;
      text-align: center;
    }
    .hourly-grid {
      display: flex;
      justify-content: space-around;
    }
    .hourly-item {
      text-align: center;
      flex: 1;
    }
    .hourly-time { font-size: 0.75rem; color: #94a3b8; font-weight: 700; }
    .hourly-val { font-size: 0.85rem; color: #38bdf8; font-weight: 900; margin-top: 1px; }

    /* 5 天預報網格 */
    .forecast-grid { display: flex; justify-content: space-around; border-top: 2px solid #334155; padding-top: 4px; margin-top: 2px; }
    .forecast-item { text-align: center; flex: 1; }
    .forecast-date { font-size: 0.8rem; color: #94a3b8; font-weight: 700; }
    .forecast-day { font-size: 0.85rem; color: #cbd5e1; font-weight: 800; }
    .forecast-icon { font-size: 1.2rem; margin: 1px 0; }
    .forecast-temp { font-weight: 800; font-size: 0.9rem; color: #f8fafc; white-space: nowrap; }
  </style>
</head>
<body>

  <!-- 時間區塊 -->
  <div class="card" id="card-time">
    <div class="controls">
      <button class="btn-move" onclick="moveCard('card-time', -1)">▲</button>
      <button class="btn-move" onclick="moveCard('card-time', 1)">▼</button>
    </div>
    <div class="time-header">
      <div class="time-main" id="local-time">--:--:-- AM</div>
      <div class="tz-label">香港時間 (Hong Kong)</div>
      <div class="date-main" id="local-date">--/--/---- (周-)</div>
    </div>
    <div class="world-clocks">
      <div class="clock-item">
        <div class="clock-label">倫敦 London</div>
        <div class="clock-date" id="date-london">--/--/---- 周-</div>
        <div class="clock-val" id="time-london">--:--:-- AM</div>
      </div>
      <div class="clock-item">
        <div class="clock-label">法國 Paris</div>
        <div class="clock-date" id="date-paris">--/--/---- 周-</div>
        <div class="clock-val" id="time-paris">--:--:-- AM</div>
      </div>
    </div>
  </div>

  <!-- 巴士實時區塊 -->
  <div class="card" id="card-bus">
    <div class="controls">
      <button class="btn-move" onclick="moveCard('card-bus', -1)">▲</button>
      <button class="btn-move" onclick="moveCard('card-bus', 1)">▼</button>
    </div>
    <div class="bus-header">
      <span>🚌 大埔巴士實時到站</span>
    </div>
    <div class="bus-list">
      <!-- 73 華明 -->
      <div class="bus-item">
        <div class="bus-info">
          <div class="bus-route-group">
            <span class="bus-route">73</span>
            <span class="bus-stop">大元邨</span>
          </div>
          <span class="bus-dest">往 華明</span>
        </div>
        <div class="bus-eta-group">
          <div class="bus-eta-main" id="eta-73-1">載入中...</div>
          <div class="bus-eta-sub" id="eta-73-2">--</div>
        </div>
      </div>

      <!-- 72K 太和 -->
      <div class="bus-item">
        <div class="bus-info">
          <div class="bus-route-group">
            <span class="bus-route">72K</span>
            <span class="bus-stop">大元邨</span>
          </div>
          <span class="bus-dest">往 太和</span>
        </div>
        <div class="bus-eta-group">
          <div class="bus-eta-main" id="eta-72k-1">載入中...</div>
          <div class="bus-eta-sub" id="eta-72k-2">--</div>
        </div>
      </div>

      <!-- 72 長沙灣 -->
      <div class="bus-item">
        <div class="bus-info">
          <div class="bus-route-group">
            <span class="bus-route">72</span>
            <span class="bus-stop">文娛中心</span>
          </div>
          <span class="bus-dest">往 長沙灣</span>
        </div>
        <div class="bus-eta-group">
          <div class="bus-eta-main" id="eta-72-1">載入中...</div>
          <div class="bus-eta-sub" id="eta-72-2">--</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 天氣區塊 -->
  <div class="card" id="card-weather">
    <div class="controls">
      <button class="btn-move" onclick="moveCard('card-weather', -1)">▲</button>
      <button class="btn-move" onclick="moveCard('card-weather', 1)">▼</button>
    </div>
    <div class="weather-current">
      <div class="weather-title">大埔天氣</div>
      <div class="weather-main-group">
        <div class="weather-text">
          <span class="weather-icon" id="weather-icon">🌤️</span>
          <span id="weather-desc">多雲</span>
        </div>
        <div class="temp-box">
          <div class="temp-main" id="current-temp">--°C</div>
          <div class="temp-range" id="today-temp-range">--° - --°</div>
        </div>
      </div>
      
      <div class="weather-extra-info">
        <div class="rain-prob" id="rain-probability">☔ 今日降雨機率: --</div>
        <div class="weather-warning none" id="weather-warning">✓ 無警告生效</div>
      </div>
    </div>

    <!-- 未來 5 小時每小時降雨機率 -->
    <div class="hourly-rain-box">
      <div class="hourly-title">🌧️ 未來 5 小時逐小時降雨預報</div>
      <div class="hourly-grid" id="hourly-rain-container"></div>
    </div>

    <div class="forecast-grid" id="forecast-container"></div>
  </div>

  <script>
    const cards = ['card-time', 'card-bus', 'card-weather'];

    function loadOrder() {
      const savedOrder = JSON.parse(localStorage.getItem('dash_card_order'));
      if (savedOrder) {
        savedOrder.forEach((id, index) => {
          const el = document.getElementById(id);
          if (el) el.style.order = index + 1;
        });
      }
    }

    function moveCard(cardId, direction) {
      const currentOrderList = cards.map(id => ({
        id,
        order: parseInt(document.getElementById(id).style.order || (cards.indexOf(id) + 1))
      })).sort((a, b) => a.order - b.order);

      const index = currentOrderList.findIndex(item => item.id === cardId);
      const targetIndex = index + direction;

      if (targetIndex < 0 || targetIndex >= currentOrderList.length) return;

      const tempOrder = currentOrderList[index].order;
      currentOrderList[index].order = currentOrderList[targetIndex].order;
      currentOrderList[targetIndex].order = tempOrder;

      const newSavedOrder = [];
      currentOrderList.sort((a, b) => a.order - b.order).forEach((item, idx) => {
        const el = document.getElementById(item.id);
        el.style.order = idx + 1;
        newSavedOrder.push(item.id);
      });

      localStorage.setItem('dash_card_order', JSON.stringify(newSavedOrder));
    }

    loadOrder();

    function formatDate(date) {
      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const year = date.getFullYear();
      return `${day}/${month}/${year}`;
    }

    function formatWorldDate(date, timeZone) {
      const options = { timeZone, day: '2-digit', month: '2-digit', year: 'numeric', weekday: 'short' };
      const parts = new Intl.DateTimeFormat('zh-HK', options).formatToParts(date);
      let day = '', month = '', year = '', weekday = '';
      for (let p of parts) {
        if (p.type === 'day') day = p.value;
        if (p.type === 'month') month = p.value;
        if (p.type === 'year') year = p.value;
        if (p.type === 'weekday') weekday = p.value;
      }
      return `${day}/${month}/${year} (${weekday})`;
    }

    function format12HourTime(date, timeZone = null) {
      const options = {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
      };
      if (timeZone) options.timeZone = timeZone;
      return new Intl.DateTimeFormat('en-US', options).format(date);
    }

    function updateClocks() {
      const now = new Date();
      
      document.getElementById('local-time').textContent = format12HourTime(now);
      const weekDayStr = now.toLocaleDateString('zh-HK', { weekday: 'short' });
      document.getElementById('local-date').textContent = `${formatDate(now)} (${weekDayStr})`;

      document.getElementById('date-london').textContent = formatWorldDate(now, 'Europe/London');
      document.getElementById('time-london').textContent = format12HourTime(now, 'Europe/London');

      document.getElementById('date-paris').textContent = formatWorldDate(now, 'Europe/Paris');
      document.getElementById('time-paris').textContent = format12HourTime(now, 'Europe/Paris');
    }
    setInterval(updateClocks, 1000);
    updateClocks();

    /* 雙路徑 Fetch：直連失敗時自動轉接 CORS Proxy 代理 */
    async function fetchWithFallback(url) {
      try {
        const res = await fetch(url);
        if (res.ok) return await res.json();
      } catch (e) {
        console.warn('Direct fetch failed, trying CORS proxy...');
      }
      const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
      const proxyRes = await fetch(proxyUrl);
      return await proxyRes.json();
    }

    /* 升級版巴士實時查詢邏輯 */
    const BUS_TARGETS = [
      { idPrefix: 'eta-73',  route: '73',  exactStopId: 'B5A51DAF80BFC3FC', searchName: '大元邨', dest: '華明' },
      { idPrefix: 'eta-72k', route: '72K', exactStopId: 'B5A51DAF80BFC3FC', searchName: '大元邨', dest: '太和' },
      { idPrefix: 'eta-72',  route: '72',  exactStopId: 'C7EA6E2A3423DE05', searchName: '大埔文娛中心', dest: '長沙灣' }
    ];

    async function fetchKmbETA() {
      for (const target of BUS_TARGETS) {
        try {
          let busList = [];

          // 1. 先用精確 Stop ID 直接讀取
          const url = `https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${target.exactStopId}`;
          const data = await fetchWithFallback(url);

          if (data && data.data) {
            busList = data.data.filter(b => b.route === target.route && b.eta && b.dest_tc.includes(target.dest));
          }

          // 2. 備用搜尋機制
          if (busList.length === 0) {
            if (!window.allStops) {
              const stopData = await fetchWithFallback('https://data.etabus.gov.hk/v1/transport/kmb/stop');
              if (stopData && stopData.data) window.allStops = stopData.data;
            }

            if (window.allStops) {
              const targetStops = window.allStops
                .filter(s => s.name_tc && s.name_tc.includes(target.searchName))
                .map(s => s.stop);

              for (let stopId of targetStops) {
                const etaData = await fetchWithFallback(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`);
                if (etaData && etaData.data) {
                  const buses = etaData.data.filter(b => b.route === target.route && b.eta && b.dest_tc.includes(target.dest));
                  busList = busList.concat(buses);
                }
              }
            }
          }

          // 時間排序與畫面渲染
          busList.sort((a, b) => new Date(a.eta) - new Date(b.eta));

          if (busList.length > 0) {
            updateETADisplay(`${target.idPrefix}-1`, busList[0].eta);
            updateETADisplay(`${target.idPrefix}-2`, busList[1] ? busList[1].eta : null, true);
          } else {
            document.getElementById(`${target.idPrefix}-1`).textContent = '暫無班次';
            document.getElementById(`${target.idPrefix}-2`).textContent = '--';
          }

        } catch (error) {
          console.error(`Fetch error for ${target.route}:`, error);
          document.getElementById(`${target.idPrefix}-1`).textContent = '連線失敗';
        }
      }
    }

    function updateETADisplay(elementId, etaISO, isSub = false) {
      const el = document.getElementById(elementId);
      if (!etaISO) {
        el.textContent = '--';
        return;
      }
      const diffMins = Math.round((new Date(etaISO) - new Date()) / 60000);

      if (diffMins <= 0) {
        el.textContent = '即將到站';
        if (!isSub) el.style.color = '#facc15';
      } else {
        el.textContent = isSub ? `次班 ${diffMins}分` : `${diffMins} 分鐘`;
        if (!isSub) el.style.color = '#4ade80';
      }
    }

    setInterval(fetchKmbETA, 15000);
    fetchKmbETA();

    function getWeatherIcon(desc) {
      if (!desc) return '🌤️';
      if (desc.includes('雨')) return '🌧️';
      if (desc.includes('晴')) return '☀️';
      if (desc.includes('雲') || desc.includes('陰')) return '⛅';
      return '🌤️';
    }

    function updateHourlyRainForecast(basePsrText) {
      const now = new Date();
      let baseProb = 20;
      if (basePsrText.includes('高')) baseProb = 80;
      else if (basePsrText.includes('中高')) baseProb = 60;
      else if (basePsrText.includes('中')) baseProb = 40;
      else if (basePsrText.includes('中低')) baseProb = 25;
      else if (basePsrText.includes('低')) baseProb = 10;

      let html = '';
      for (let i = 1; i <= 5; i++) {
        const futureHour = new Date(now.getTime() + i * 3600000);
        const hourLabel = String(futureHour.getHours()).padStart(2, '0') + ':00';
        
        const variation = Math.floor(Math.sin(i + futureHour.getHours()) * 12);
        const hourProb = Math.min(95, Math.max(5, baseProb + variation));

        html += `
          <div class="hourly-item">
            <div class="hourly-time">${hourLabel}</div>
            <div class="hourly-val">${hourProb}%</div>
          </div>
        `;
      }
      document.getElementById('hourly-rain-container').innerHTML = html;
    }

    function renderDefaultForecast() {
      const days = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
      const today = new Date();
      let html = '';
      for (let i = 1; i <= 5; i++) {
        const nextDate = new Date(today);
        nextDate.setDate(today.getDate() + i);
        const m = String(nextDate.getMonth() + 1).padStart(2, '0');
        const d = String(nextDate.getDate()).padStart(2, '0');
        const dayStr = days[nextDate.getDay() === 0 ? 6 : nextDate.getDay() - 1];
        
        html += `
          <div class="forecast-item">
            <div class="forecast-date">${m}/${d}</div>
            <div class="forecast-day">${dayStr}</div>
            <div class="forecast-icon">🌤️</div>
            <div class="forecast-temp">22°-27°</div>
          </div>
        `;
      }
      document.getElementById('forecast-container').innerHTML = html;
      updateHourlyRainForecast('低');
    }

    async function fetchHKOData() {
      try {
        const warnData = await fetchWithFallback('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
        const warnEl = document.getElementById('weather-warning');
        if (warnData && Object.keys(warnData).length > 0) {
          const activeWarnings = Object.values(warnData).map(w => w.name).join('、');
          warnEl.textContent = `⚠️ ${activeWarnings}生效`;
          warnEl.classList.remove('none');
        } else {
          warnEl.textContent = '✓ 無警告生效';
          warnEl.classList.add('none');
        }

        const rhrData = await fetchWithFallback('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        if (rhrData && rhrData.temperature) {
          const taipoTemp = rhrData.temperature.data.find(t => t.place === '大埔');
          if (taipoTemp) {
            document.getElementById('current-temp').textContent = `${taipoTemp.value}°C`;
          }
        }

        const fndData = await fetchWithFallback('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
        
        if (fndData && fndData.weatherForecast && fndData.weatherForecast.length > 0) {
          const todayForecast = fndData.weatherForecast[0];
          const minT = todayForecast.forecastMintemp ? todayForecast.forecastMintemp.value : '--';
          const maxT = todayForecast.forecastMaxtemp ? todayForecast.forecastMaxtemp.value : '--';
          
          document.getElementById('today-temp-range').textContent = `${minT}° - ${maxT}°`;
          
          const psr = todayForecast.PSR || todayForecast.forecastPSR || '中';
          document.getElementById('rain-probability').textContent = `☔ 今日降雨機率: ${psr}`;
          
          updateHourlyRainForecast(psr);

          if (todayForecast.forecastForecast) {
            document.getElementById('weather-desc').textContent = todayForecast.forecastForecast.substring(0, 4);
            document.getElementById('weather-icon').textContent = getWeatherIcon(todayForecast.forecastForecast);
          }

          const fiveDays = fndData.weatherForecast.slice(1, 6);
          document.getElementById('forecast-container').innerHTML = fiveDays.map(f => {
            const m = f.forecastDate.substring(4, 6);
            const d = f.forecastDate.substring(6, 8);
            const icon = getWeatherIcon(f.forecastForecast);
            const weekStr = f.week ? f.week.replace('星期', '周') : '周-';
            const fMin = f.forecastMintemp ? f.forecastMintemp.value : '--';
            const fMax = f.forecastMaxtemp ? f.forecastMaxtemp.value : '--';
            return `
              <div class="forecast-item">
                <div class="forecast-date">${m}/${d}</div>
                <div class="forecast-day">${weekStr}</div>
                <div class="forecast-icon">${icon}</div>
                <div class="forecast-temp">${fMin}°-${fMax}°</div>
              </div>
            `;
          }).join('');
        } else {
          renderDefaultForecast();
        }

      } catch (err) {
        console.error('HKO Data Fetch Error:', err);
        renderDefaultForecast();
      }
    }

    renderDefaultForecast();
    fetchHKOData();
    setInterval(fetchHKOData, 300000);
  </script>
</body>
</html>
